name: Build && Deploy

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.get-version-id.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tag or commit id
        id: get-version-id
        uses: iawia002/get-tag-or-commit-id@v1
        with:
          length: 7

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请本地执行 gofmt -w . 后提交：" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check swagger docs are up to date
        run: |
          # 与 go.mod 保持同一版本，避免生成结果因版本漂移产生假差异
          SWAG_VERSION=$(go list -m -f '{{.Version}}' github.com/swaggo/swag)
          go install github.com/swaggo/swag/cmd/swag@"${SWAG_VERSION}"
          "$(go env GOPATH)/bin/swag" init
          if ! git diff --exit-code docs/; then
            echo "docs/ 与接口注释不同步，请本地执行 swag init 后提交。" >&2
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Test
        env: 
          EVENTGLIDE_NACOS_CONF: ${{ secrets.EVENTGLIDE_NACOS_CONF }}
        run: go test -v ./...

  build:
    if : github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # 跨国推送镜像偶发卡死，设置上限避免无限挂起。
    timeout-minutes: 30
    needs:
      - test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 限制 Docker 并发上传连接数，集中带宽，避免多连接争抢导致丢包。
      - name: Configure Docker
        run: |
          set -euo pipefail
          sudo bash -c 'cat > /etc/docker/daemon.json <<EOF
          {
            "max-concurrent-uploads": 1
          }
          EOF'
          sudo systemctl restart docker

      # docker/login-action 只执行一次 docker login，登录会 ping <registry>/v2/，
      # 跨国网络抖动时连接被 reset 会直接判整个 job 失败，故自行重试。
      - name: Login to Docker
        env:
          REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          REGISTRY_USER: ${{ secrets.ALIYUN_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -euo pipefail
          success=false
          for i in {1..5}; do
            echo "Login attempt $i/5..."
            if printf '%s' "$REGISTRY_PASSWORD" | docker login \
              --username="$REGISTRY_USER" \
              --password-stdin \
              "$REGISTRY"; then
              success=true
              echo "Login succeeded on attempt $i!"
              break
            else
              echo "Login attempt $i failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          if [[ "$success" != "true" ]]; then
            echo "ERROR: Failed to log in to registry after 5 attempts due to network issues." >&2
            exit 1
          fi

      - name: Build And Push
        env:
          TAG: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.ALIYUN_REGISTRY_NAME }}:${{ needs.test.outputs.id }}
        run: |
          set -euo pipefail

          # 禁用 IPv6，避免跨国路由解析异常
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 >/dev/null 2>&1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 >/dev/null 2>&1 || true

          # 使用宿主机原生 Docker 构建镜像
          echo "Building image $TAG..."
          docker build -t "$TAG" -f ./Dockerfile .

          # 伪造 TTY 环境运行 docker push，使进度条在 GitHub Actions 中实时输出
          push_with_progress() {
            if command -v python3 >/dev/null 2>&1; then
              python3 -c 'import pty, sys; sys.exit(pty.spawn(["docker", "push", sys.argv[1]]))' "$TAG"
            else
              docker push "$TAG"
            fi
          }

          # 针对跨国网络波动增加最多 5 次重试
          echo "Pushing image $TAG to Aliyun..."
          success=false
          for i in {1..5}; do
            echo "Push attempt $i/5..."
            if push_with_progress; then
              success=true
              echo "Push succeeded on attempt $i!"
              break
            else
              echo "Push attempt $i failed, retrying in 5 seconds..."
              sleep 5
            fi
          done

          if [[ "$success" != "true" ]]; then
            echo "ERROR: Failed to push image after 5 attempts due to network issues." >&2
            exit 1
          fi

  deploy:
    if : github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs:
      - test
      - build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER }} >> ~/.ssh/known_hosts

      - name: SSH and deploy
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER }} "
            set -e
            cd eventglide
            echo '${{ secrets.ALIYUN_PASSWORD }}' | docker login \
            --username=${{ secrets.ALIYUN_USERNAME }} \
            --password-stdin \
            ${{ secrets.ALIYUN_REGISTRY }}
            echo 'EVENT_GLIDE=${{ needs.test.outputs.id }}' > .env
            docker compose -f docker-compose.yaml pull
            docker compose -f docker-compose.yaml up -d
            docker image prune -a -f
          "
